<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты и Отзывы | Медовая лавка</title>
    <style>
        /* Общие базовые стили */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f2;
            color: #4a3b32;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #d4a373;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            color: #bc6c25;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Блок карты */
        .map-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.2);
            margin-bottom: 40px;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 400px;
            border: 0;
            border-radius: 8px;
        }

        /* Блок отзывов */
        .reviews-section {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(212, 163, 115, 0.15);
        }

        /* Форма добавления отзыва */
        .review-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: #fefae0;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #faedcd;
        }

        .rating-select {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .rating-select span {
            font-size: 30px;
            color: #d4a373;
            transition: color 0.2s;
        }

        .rating-select span.active,
        .rating-select span:hover {
            color: #dda15e;
        }

        .review-form input,
        .review-form textarea {
            padding: 12px;
            border: 1px solid #ccd5ae;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: #fff;
            color: #4a3b32;
        }

        .review-form input:focus,
        .review-form textarea:focus {
            border-color: #bc6c25;
            box-shadow: 0 0 5px rgba(188, 108, 37, 0.2);
        }

        .review-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .review-btn {
            background-color: #bc6c25;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            align-self: flex-start;
        }

        .review-btn:hover {
            background-color: #9b581e;
        }

        /* Список отзывов */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .review-card {
            background: #fdf0d5;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #bc6c25;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-author {
            font-weight: bold;
            font-size: 17px;
            color: #603813;
        }

        .review-stars {
            color: #dda15e;
            font-size: 18px;
        }

        .review-text {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .review-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .edit-btn {
            color: #d4a373;
            background: #fff;
            border: 1px solid #d4a373;
        }

        .edit-btn:hover {
            background: #faedcd;
        }

        .delete-btn {
            color: #e63946;
            background: #fff;
            border: 1px solid #e63946;
        }

        .delete-btn:hover {
            background: #ffe5e9;
        }

        .admin-badge {
            background: #e63946;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <header>
        <h1>Медовая лавка</h1>
        <p>Свяжитесь с нами и поделитесь впечатлениями</p>
    </header>

    <div class="container">
        <h2>Наш адрес на карте</h2>
        <!-- Блок карты -->
        <div class="map-container">
            <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A7214732152864140026e6e3c3b01e38b3293844d18833075c02685934bc07455&amp;source=constructor" width="100%" height="400" frameborder="0"></iframe>
        </div>

        <!-- Блок отзывов -->
        <div class="reviews-section">
            <h2>Отзывы покупателей</h2>

            <!-- Форма отправки отзыва -->
            <form class="review-form" id="reviewForm">
                <input type="hidden" id="editIndex" value="-1">
                <div class="rating-select" id="starContainer">
                    <span data-value="1">★</span>
                    <span data-value="2">★</span>
                    <span data-value="3">★</span>
                    <span data-value="4">★</span>
                    <span data-value="5">★</span>
                </div>
                <input type="hidden" id="reviewRating" value="5">
                <input type="text" id="reviewAuthor" placeholder="Ваше имя (или спец-логин администратора)" required>
                <textarea id="reviewText" placeholder="Напишите ваш отзыв о нашем меде... (Админам: введите спец-пароль)" required></textarea>
                <button type="submit" class="review-btn" id="submitBtn">Оставить отзыв</button>
            </form>

            <!-- Список, куда выводятся отзывы -->
            <div class="reviews-list" id="reviewsList"></div>
        </div>
    </div>

    <script>
        // Настройки админа
        const ADMIN_LOGIN = "Admin";
        const ADMIN_PASS = "honey123";

        // Простейший фильтр нецензурных слов (можно дополнять)
        const badWords = ["хуй", "пизда", "ебать", "сука", "блять", "блдь", "идиот", "мразота", "fuck", "shit"];

        function filterText(text) {
            let filtered = text;
            badWords.forEach(word => {
                const regex = new RegExp(word, 'gi');
                filtered = filtered.replace(regex, '***');
            });
            return filtered;
        }

        // Работа со звездами
        const stars = document.querySelectorAll('#starContainer span');
        const ratingInput = document.getElementById('reviewRating');

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const val = star.getAttribute('data-value');
                ratingInput.value = val;
                stars.forEach(s => {
                    if (s.getAttribute('data-value') <= val) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });
        // Инициализация звезд по умолчанию (все 5 активны)
        stars.forEach(s => s.classList.add('active'));

        // Загрузка отзывов из localStorage
        function getReviews() {
            return JSON.parse(localStorage.getItem('honey_reviews')) || [];
        }

        function saveReviews(reviews) {
            localStorage.setItem('honey_reviews', JSON.stringify(reviews));
        }

        // Рендер отзывов на странице
        function renderReviews() {
            const list = document.getElementById('reviewsList');
            const reviews = getReviews();
            const currentSessionId = localStorage.getItem('honey_session_id') || createSessionId();

            list.innerHTML = '';

            if (reviews.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #888;">Пока нет отзывов. Станьте первым!</p>';
                return;
            }

            reviews.forEach((rev, index) => {
                const card = document.createElement('div');
                card.className = 'review-card';

                const starsHtml = '★'.repeat(rev.rating) + '☆'.repeat(5 - rev.rating);
                
                // Проверка прав: автор отзыва ИЛИ админ
                const isAdmin = localStorage.getItem('is_honey_admin') === 'true';
                const isAuthor = rev.sessionId === currentSessionId;

                let actionsHtml = '';
                if (isAuthor || isAdmin) {
                    actionsHtml = `
                        <div class="review-actions">
                            ${isAuthor ? `<button class="action-btn edit-btn" onclick="editReview(${index})">Изменить</button>` : ''}
                            <button class="action-btn delete-btn" onclick="deleteReview(${index})">Удалить</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="review-header">
                        <span class="review-author">${escapeHtml(rev.author)} ${rev.isAdminPost ? '<span class="admin-badge">Админ</span>' : ''}</span>
                        <span class="review-stars">${starsHtml}</span>
                    </div>
                    <div class="review-text">${escapeHtml(rev.text)}</div>
                    ${actionsHtml}
                `;

                list.appendChild(card);
            });
        }

        function createSessionId() {
            const id = 'sess_' + Math.random().toString(36.2) + Date.now();
            localStorage.setItem('honey_session_id', id);
            return id;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Обработка формы
        const form = document.getElementById('reviewForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const authorInput = document.getElementById('reviewAuthor').value.trim();
            const textInput = document.getElementById('reviewText').value.trim();
            const rating = parseInt(ratingInput.value);
            const editIndex = parseInt(document.getElementById('editIndex').value);

            // Проверка режима Администратора
            let isAdminPost = false;
            if (authorInput === ADMIN_LOGIN && textInput === ADMIN_PASS) {
                localStorage.setItem('is_honey_admin', 'true');
                alert('Режим администратора активирован!');
                form.reset();
                document.getElementById('editIndex').value = '-1';
                document.getElementById('submitBtn').innerText = 'Оставить отзыв';
                renderReviews();
                return;
            }

            // Фильтрация мата
            const cleanText = filterText(textInput);
            const reviews = getReviews();
            const sessionId = localStorage.getItem('honey_session_id') || createSessionId();

            if (editIndex > -1) {
                // Редактирование существующего
                reviews[editIndex].text = cleanText;
                reviews[editIndex].rating = rating;
                document.getElementById('editIndex').value = '-1';
                document.getElementById('submitBtn').innerText = 'Оставить отзыв';
            } else {
                // Добавление нового
                reviews.unshift({
                    author: authorInput,
                    text: cleanText,
                    rating: rating,
                    sessionId: sessionId,
                    isAdminPost: false
                });
            }

            saveReviews(reviews);
            form.reset();
            // Сброс звезд на 5
            ratingInput.value = 5;
            stars.forEach(s => s.classList.add('active'));
            renderReviews();
        });

        // Функция удаления отзыва
        window.deleteReview = function(index) {
            if (confirm('Вы уверены, что хотите удалить этот отзыв?')) {
                let reviews = getReviews();
                reviews.splice(index, 1);
                saveReviews(reviews);
                renderReviews();
            }
        };

        // Функция редактирования отзыва
        window.editReview = function(index) {
            let reviews = getReviews();
            let rev = reviews[index];

            document.getElementById('reviewAuthor').value = rev.author;
            document.getElementById('reviewText').value = rev.text;
            ratingInput.value = rev.rating;
            document.getElementById('editIndex').value = index;
            document.getElementById('submitBtn').innerText = 'Сохранить изменения';

            // Подсветка звезд
            stars.forEach(s => {
                if (s.getAttribute('data-value') <= rev.rating) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });

            window.scrollTo({ top: form.offsetTop - 50, behavior: 'smooth' });
        };

        // Первичный запуск отрисовки
        renderReviews();
    </script>
</body>
</html>
